[project]
name = "e2ee-chat"
version = "0.1.0"
description = "CECS 378 semester project: a chat app, a man-in-the-middle attack on it, and end-to-end encryption that stops it."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = pyflakes + pycodestyle errors, I = import order, B = common bugs, S = security checks (bandit rules)
select = ["E", "F", "I", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# plain asserts and subprocess calls are expected in tests
"tests/**" = ["S101", "S603", "S607"]
