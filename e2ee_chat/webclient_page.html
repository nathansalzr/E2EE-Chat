<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__USER__ — E2EE Chat</title>
<style>
  :root { color-scheme: light dark; --bg:#0f1220; --panel:#1a1f35; --me:#2b5cff;
          --them:#2b2f45; --muted:#8a90a6; --ok:#2ecc71; --text:#eef0f6; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--text); height:100vh;
         display:flex; justify-content:center; }
  .app { width:min(560px,100%); display:flex; flex-direction:column; height:100vh; }
  header { padding:12px 16px; background:var(--panel); border-bottom:1px solid #000a; }
  header .who { font-weight:600; }
  header .peer { color:var(--muted); font-size:13px; }
  #status { margin-top:6px; font-size:13px; color:var(--muted); }
  #status.secure { color:var(--ok); }
  #log { flex:1; overflow-y:auto; padding:16px;
         display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:78%; padding:8px 12px; border-radius:14px;
         white-space:pre-wrap; word-wrap:break-word; }
  .them { background:var(--them); align-self:flex-start; border-bottom-left-radius:4px; }
  .me   { background:var(--me);   align-self:flex-end;   border-bottom-right-radius:4px; }
  .sys  { align-self:center; color:var(--muted); font-size:13px; }
  .err  { align-self:center; color:#ff6b6b; font-size:13px; }
  #status.plain { color:#ffb020; }
  .fp { margin-top:6px; font-size:12px; color:var(--muted); font-family:ui-monospace,monospace;
        line-height:1.5; }
  .fp .lbl { color:var(--text); }
  .alarm { margin-top:8px; padding:8px 10px; border-radius:8px; background:#3a0d0d;
           border:1px solid #ff6b6b; color:#ffd7d7; font-size:13px; }
  .alarm-btns { margin-top:8px; display:flex; gap:8px; }
  .alarm-btns button { padding:6px 12px; font-size:13px; }
  #trust { background:#c0392b; }
  #abort { background:var(--them); }
  form { display:flex; gap:8px; padding:12px 16px;
         background:var(--panel); border-top:1px solid #000a; }
  input { flex:1; padding:10px 12px; border-radius:10px; border:1px solid #000a;
          background:var(--bg); color:var(--text); }
  button { padding:10px 16px; border:0; border-radius:10px;
           background:var(--me); color:#fff; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="who">__USER__</div>
    <div class="peer">chatting with __PEER__</div>
    <div id="status">connecting…</div>
    <div id="fp" class="fp" hidden></div>
    <div id="alarm" class="alarm" hidden>
      <div id="alarm-text"></div>
      <div class="alarm-btns">
        <button id="trust" type="button">Trust new key</button>
        <button id="abort" type="button">Abort</button>
      </div>
    </div>
  </header>
  <div id="log"></div>
  <form id="f">
    <input id="t" autocomplete="off" placeholder="Type a message…" autofocus>
    <button id="send">Send</button>
  </form>
</div>
<script>
  const log = document.getElementById('log');
  const status = document.getElementById('status');
  const form = document.getElementById('f');
  const input = document.getElementById('t');
  const sendBtn = document.getElementById('send');
  const fp = document.getElementById('fp');
  const alarm = document.getElementById('alarm');
  const alarmText = document.getElementById('alarm-text');
  const peer = '__PEER__';
  const mode = '__MODE__';
  let ready = mode === 'plain';
  if (mode === 'plain') {
    status.textContent = '⚠ plain mode — messages are NOT encrypted';
    status.className = 'plain';
  }

  function setBlocked(blocked) {
    input.disabled = blocked;
    sendBtn.disabled = blocked;
  }

  function showFingerprints(ev) {
    if (!ev.my_fingerprint) return;
    fp.hidden = false;
    fp.innerHTML = '<span class="lbl">you:</span> ' + ev.my_fingerprint
                 + '<br><span class="lbl">' + peer + ':</span> ' + ev.peer_fingerprint;
  }

  async function post(path, body) {
    const r = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    });
    return r.json();
  }
  document.getElementById('trust').addEventListener('click', () => post('/trust'));
  document.getElementById('abort').addEventListener('click', () => post('/abort'));

  function add(cls, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }

  const es = new EventSource('/events');
  es.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    if (ev.kind === 'chat') {
      add(ev.mine ? 'me' : 'them',
          (ev.encrypted ? '🔒 ' : '') + (ev.mine ? '' : ev.from + ': ') + ev.text);
    } else if (ev.kind === 'secure') {
      showFingerprints(ev);
      if (ev.trust === 'changed') {
        ready = false;
        setBlocked(true);
        status.textContent = '⚠ ' + peer + "'s key CHANGED — verify before trusting";
        status.className = 'plain';
        alarm.hidden = false;
        alarmText.textContent = peer + "'s key has changed since last time. This could be a "
          + 'man-in-the-middle. Compare the fingerprints above with ' + peer
          + ' in person or by phone, then Trust or Abort.';
      } else {
        ready = true;
        setBlocked(false);
        const note = ev.trust === 'new' ? ' (new contact — verify the fingerprints once)' : '';
        status.textContent = '🔒 secure session — key ' + ev.key_hash + note;
        status.className = 'secure';
      }
    } else if (ev.kind === 'trusted') {
      ready = true;
      setBlocked(false);
      alarm.hidden = true;
      status.textContent = '🔒 ' + peer + "'s new key trusted";
      status.className = 'secure';
      add('sys', peer + "'s key is now trusted and pinned.");
    } else if (ev.kind === 'system') {
      add('sys', ev.text);
    } else if (ev.kind === 'error') {
      add('err', ev.text);
    }
  };
  es.onopen = () => {
    if (!ready && mode === 'e2ee') status.textContent = 'setting up secure session…';
  };

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value;
    if (!text.trim()) return;
    input.value = '';
    const r = await fetch('/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const res = await r.json();
    if (!res.ok && res.reason === 'not_ready') {
      add('sys', 'still setting up the secure session — try again in a moment');
    } else if (!res.ok && res.reason === 'key_changed') {
      add('err', peer + "'s key changed — Trust it or Abort before sending");
    } else if (!res.ok) {
      add('err', 'could not send (' + (res.reason || 'error') + ')');
    }
  });
</script>
</body>
</html>
