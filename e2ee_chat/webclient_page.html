<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__USER__ — E2EE Chat</title>
<style>
  :root { color-scheme: light dark; --bg:#0f1220; --panel:#1a1f35; --me:#2b5cff;
          --them:#2b2f45; --muted:#8a90a6; --ok:#2ecc71; --text:#eef0f6; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--text); height:100vh;
         display:flex; justify-content:center; }
  .app { width:min(560px,100%); display:flex; flex-direction:column; height:100vh; }
  header { padding:12px 16px; background:var(--panel); border-bottom:1px solid #000a; }
  header .who { font-weight:600; }
  header .peer { color:var(--muted); font-size:13px; }
  #status { margin-top:6px; font-size:13px; color:var(--muted); }
  #status.secure { color:var(--ok); }
  #log { flex:1; overflow-y:auto; padding:16px;
         display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:78%; padding:8px 12px; border-radius:14px;
         white-space:pre-wrap; word-wrap:break-word; }
  .them { background:var(--them); align-self:flex-start; border-bottom-left-radius:4px; }
  .me   { background:var(--me);   align-self:flex-end;   border-bottom-right-radius:4px; }
  .sys  { align-self:center; color:var(--muted); font-size:13px; }
  .err  { align-self:center; color:#ff6b6b; font-size:13px; }
  #status.plain { color:#ffb020; }
  form { display:flex; gap:8px; padding:12px 16px;
         background:var(--panel); border-top:1px solid #000a; }
  input { flex:1; padding:10px 12px; border-radius:10px; border:1px solid #000a;
          background:var(--bg); color:var(--text); }
  button { padding:10px 16px; border:0; border-radius:10px;
           background:var(--me); color:#fff; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="who">__USER__</div>
    <div class="peer">chatting with __PEER__</div>
    <div id="status">connecting…</div>
  </header>
  <div id="log"></div>
  <form id="f">
    <input id="t" autocomplete="off" placeholder="Type a message…" autofocus>
    <button id="send">Send</button>
  </form>
</div>
<script>
  const log = document.getElementById('log');
  const status = document.getElementById('status');
  const form = document.getElementById('f');
  const input = document.getElementById('t');
  const mode = '__MODE__';
  let ready = mode === 'plain';
  if (mode === 'plain') {
    status.textContent = '⚠ plain mode — messages are NOT encrypted';
    status.className = 'plain';
  }

  function add(cls, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }

  const es = new EventSource('/events');
  es.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    if (ev.kind === 'chat') {
      add(ev.mine ? 'me' : 'them',
          (ev.encrypted ? '🔒 ' : '') + (ev.mine ? '' : ev.from + ': ') + ev.text);
    } else if (ev.kind === 'secure') {
      ready = true;
      status.textContent = '🔒 secure session established — key ' + ev.key_hash
                         + ' (compare with your peer)';
      status.className = 'secure';
    } else if (ev.kind === 'system') {
      add('sys', ev.text);
    } else if (ev.kind === 'error') {
      add('err', ev.text);
    }
  };
  es.onopen = () => {
    if (!ready && mode === 'e2ee') status.textContent = 'setting up secure session…';
  };

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value;
    if (!text.trim()) return;
    input.value = '';
    const r = await fetch('/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const res = await r.json();
    if (!res.ok && res.reason === 'not_ready') {
      add('sys', 'still setting up the secure session — try again in a moment');
    } else if (!res.ok) {
      add('err', 'could not send (' + (res.reason || 'error') + ')');
    }
  });
</script>
</body>
</html>
