<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attacker console — E2EE Chat</title>
<style>
  :root { color-scheme: dark; --bg:#140d0d; --panel:#231414; --text:#f2e9e9;
          --muted:#b08a8a; --accent:#c0392b; --grey:#8a90a6; --orange:#ffb020; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--text); height:100vh; display:flex;
         flex-direction:column; }
  header { padding:12px 16px; background:var(--panel); border-bottom:1px solid #000a; }
  header h1 { margin:0 0 4px; font-size:16px; }
  header .sub { color:var(--muted); font-size:13px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; padding:12px 16px; background:var(--panel);
         border-bottom:1px solid #000a; align-items:center; }
  .bar .modes { display:flex; gap:8px; }
  button { padding:8px 14px; border:1px solid #0006; border-radius:8px; cursor:pointer;
           background:#2b2f45; color:#fff; font-weight:600; font-size:13px; }
  button.active { background:var(--accent); border-color:#fff3; }
  button.clear { margin-left:auto; background:#2b2f45; font-weight:400; }
  .links { padding:8px 16px; font-size:13px; color:var(--muted); }
  .links a { color:#8ab4ff; }
  #mode-note { padding:0 16px 8px; font-size:13px; color:var(--muted); }
  #feed { flex:1; overflow-y:auto; padding:12px 16px; font-family:ui-monospace,monospace;
          font-size:13px; display:flex; flex-direction:column; gap:3px; }
  .row { white-space:pre-wrap; word-break:break-all; padding:2px 6px; border-radius:4px; }
  .readable { color:#ff8a8a; background:#3a0d0d; }   /* plaintext the attacker can read */
  .decrypted { color:#fff; background:var(--accent); font-weight:600; }
  .cipher { color:var(--grey); }                      /* unreadable ciphertext */
  .tampered { color:var(--orange); }
  .meta { color:var(--muted); }
  .empty { color:var(--muted); font-style:italic; }
</style>
</head>
<body>
  <header>
    <h1>🕵 Attacker console</h1>
    <div class="sub">man-in-the-middle on <b>__MITM__</b> → relay <b>__SERVER__</b>. Our own app, our own machines only.</div>
  </header>
  <div class="bar">
    <div class="modes">
      <button data-mode="off" type="button">Off (just forward)</button>
      <button data-mode="log" type="button">Listen</button>
      <button data-mode="tamper" type="button">Tamper</button>
      <button data-mode="swap-keys" type="button">Swap keys</button>
    </div>
    <button class="clear" type="button" id="clear">Clear feed</button>
  </div>
  <div id="mode-note"></div>
  <div class="links">Chat windows: <a href="__ALICE__" target="_blank">Alice</a> · <a href="__BOB__" target="_blank">Bob</a></div>
  <div id="feed"><div class="empty">No traffic yet. Pick a mode, then send a message in a chat window.</div></div>
<script>
  const feed = document.getElementById('feed');
  const note = document.getElementById('mode-note');
  const buttons = [...document.querySelectorAll('[data-mode]')];
  let current = '__START__';
  let empty = true;

  const NOTES = {
    'off': 'Forwarding only — not even logging. The chat works and nothing is recorded.',
    'log': 'Recording every frame. In plain chat you see the text; once both sides use e2ee you see only ciphertext.',
    'tamper': 'Flipping one byte of each encrypted message. The recipient should reject it.',
    'swap-keys': 'Handing each side our own key. If nobody checks fingerprints we read everything — watch for DECRYPTED lines.',
  };

  function paint() {
    buttons.forEach(b => b.classList.toggle('active', b.dataset.mode === current));
    note.textContent = NOTES[current] || '';
  }

  function classify(direction) {
    if (direction.startsWith('DECRYPTED')) return 'decrypted';
    if (direction.includes('TAMPERED')) return 'tampered';
    return null;  // decided per row by content below
  }

  function add(ev) {
    if (empty) { feed.innerHTML = ''; empty = false; }
    const row = document.createElement('div');
    let cls = classify(ev.direction);
    if (!cls) cls = /'type': 'encrypted'/.test(ev.text) ? 'cipher' : 'readable';
    row.className = 'row ' + cls;
    row.textContent = `[${ev.time}] ${ev.direction} ${ev.text}`;
    feed.appendChild(row);
    feed.scrollTop = feed.scrollHeight;
  }

  async function setMode(mode) {
    const r = await fetch('/mode', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode })
    });
    if (r.ok) { current = mode; paint(); }
  }

  buttons.forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
  document.getElementById('clear').addEventListener('click', async () => {
    await fetch('/clear', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    feed.innerHTML = '<div class="empty">(cleared)</div>'; empty = true;
  });

  const es = new EventSource('/events');
  es.onmessage = (e) => add(JSON.parse(e.data));
  paint();
</script>
</body>
</html>
